<pattern id="hatch_vert" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#ffffff"/><line x1="3" y1="0" x2="3" y2="6" stroke="#333333" stroke-width="1.5"/></pattern>
<pattern id="solid_dark" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#555555"/></pattern>
<pattern id="solid_light" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#dddddd"/></pattern>
