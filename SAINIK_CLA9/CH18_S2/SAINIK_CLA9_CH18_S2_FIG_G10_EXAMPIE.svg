<text x="202.5" y="110.3" font-family="sans-serif" font-size="9" font-weight="normal" fill="#333333" text-anchor="middle">54°</text>
<path d="M 150 130 L 245.0 130.0 A 95 95 0 0 1 59.6 159.4 Z" fill="url(#hatch_grid)" stroke="#333333" stroke-width="1.3"/>
