<text x="159.2" y="195.2" font-family="sans-serif" font-size="9" font-weight="normal" fill="#333333" text-anchor="middle">162°</text>
<path d="M 150 130 L 59.6 159.4 A 95 95 0 0 1 150.0 35.0 Z" fill="url(#hatch_horiz)" stroke="#333333" stroke-width="1.3"/>
<text x="102.3" y="90.4" font-family="sans-serif" font-size="9" font-weight="normal" fill="#333333" text-anchor="middle">3rd Division</text>
