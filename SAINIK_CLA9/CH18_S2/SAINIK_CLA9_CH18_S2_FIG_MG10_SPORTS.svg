<svg viewBox="0 0 300 280" xmlns="http://www.w3.org/2000/svg">
<rect x="0" y="0" width="300" height="280" fill="#ffffff"/>
<defs>
<pattern id="hatch_diag1" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#333333" stroke-width="1.5"/></pattern>
<pattern id="hatch_diag2" width="6" height="6" patternTransform="rotate(-45)" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#333333" stroke-width="1.5"/></pattern>
<pattern id="hatch_dots" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#ffffff"/><circle cx="3.5" cy="3.5" r="1.3" fill="#333333"/></pattern>
<pattern id="hatch_grid" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#ffffff"/><line x1="0" y1="0" x2="6" y2="0" stroke="#333333" stroke-width="1"/><line x1="0" y1="0" x2="0" y2="6" stroke="#333333" stroke-width="1"/></pattern>
<pattern id="hatch_horiz" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#ffffff"/><line x1="0" y1="3" x2="6" y2="3" stroke="#333333" stroke-width="1.5"/></pattern>
<pattern id="hatch_vert" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#ffffff"/><line x1="3" y1="0" x2="3" y2="6" stroke="#333333" stroke-width="1.5"/></pattern>
<pattern id="solid_dark" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#555555"/></pattern>
<pattern id="solid_light" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#dddddd"/></pattern>
</defs>
<path d="M 150 130 L 150.0 35.0 A 95 95 0 0 1 211.1 57.2 Z" fill="url(#hatch_diag1)" stroke="#333333" stroke-width="1.3"/>
<text x="170.1" y="69.7" font-family="sans-serif" font-size="9" font-weight="normal" fill="#333333" text-anchor="middle">Did Not Finish</text>
<text x="170.1" y="81.7" font-family="sans-serif" font-size="9" font-weight="normal" fill="#333333" text-anchor="middle">40°</text>
<path d="M 150 130 L 211.1 57.2 A 95 95 0 0 1 243.6 146.5 Z" fill="url(#hatch_dots)" stroke="#333333" stroke-width="1.3"/>
<text x="205.3" y="104.9" font-family="sans-serif" font-size="9" font-weight="normal" fill="#333333" text-anchor="middle">Gold</text>
<text x="205.3" y="116.9" font-family="sans-serif" font-size="9" font-weight="normal" fill="#333333" text-anchor="middle">60°</text>
<path d="M 150 130 L 243.6 146.5 A 95 95 0 0 1 67.7 177.5 Z" fill="url(#hatch_grid)" stroke="#333333" stroke-width="1.3"/>
<text x="160.2" y="183.0" font-family="sans-serif" font-size="9" font-weight="normal" fill="#333333" text-anchor="middle">Silver</text>
<text x="160.2" y="195.0" font-family="sans-serif" font-size="9" font-weight="normal" fill="#333333" text-anchor="middle">140°</text>
<path d="M 150 130 L 67.7 177.5 A 95 95 0 0 1 150.0 35.0 Z" fill="url(#hatch_horiz)" stroke="#333333" stroke-width="1.3"/>
<text x="99.0" y="95.5" font-family="sans-serif" font-size="9" font-weight="normal" fill="#333333" text-anchor="middle">Bronze</text>
<text x="99.0" y="107.5" font-family="sans-serif" font-size="9" font-weight="normal" fill="#333333" text-anchor="middle">120°</text>
