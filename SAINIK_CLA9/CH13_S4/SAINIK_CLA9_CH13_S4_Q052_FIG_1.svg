<svg viewBox="0 0 700 460" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="700" height="460" fill="#ffffff"/>

  <!-- Panel P: male reproductive system schematic -->
  <g stroke="#333333" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- vas deferens loops from top down to testes -->
    <path d="M 150 60 C 100 60, 90 110, 100 170 C 108 220, 130 260, 148 300"/>
    <path d="M 200 60 C 250 60, 260 110, 250 170 C 242 220, 220 260, 202 300"/>
    <!-- central duct / urethra -->
    <path d="M 175 55 L 175 340"/>
    <path d="M 165 330 L 185 330 L 180 350 L 170 350 Z"/>
    <!-- testes -->
    <ellipse cx="128" cy="330" rx="30" ry="42"/>
    <ellipse cx="222" cy="330" rx="30" ry="42"/>
    <!-- top connective arch -->
    <path d="M 150 60 Q 175 40 200 60"/>
  </g>
  <text x="175" y="410" font-family="sans-serif" font-size="26" font-weight="bold" fill="#333333" text-anchor="middle">P</text>

  <!-- Panel Q: female reproductive system schematic -->
  <g stroke="#333333" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- left fallopian tube, curling to ovary -->
    <path d="M 460 170 C 420 150, 400 110, 420 75 C 435 50, 465 45, 485 60 C 500 72, 498 92, 480 98"/>
    <ellipse cx="418" cy="120" rx="16" ry="22" transform="rotate(-20 418 120)"/>
    <!-- right fallopian tube, curling to ovary -->
    <path d="M 540 170 C 580 150, 600 110, 580 75 C 565 50, 535 45, 515 60 C 500 72, 502 92, 520 98"/>
    <ellipse cx="582" cy="120" rx="16" ry="22" transform="rotate(20 582 120)"/>
    <!-- uterus body: funnel from tubes down to cervix -->
    <path d="M 460 170 C 460 210, 470 230, 500 235 C 530 230, 540 210, 540 170"/>
    <path d="M 460 170 L 470 230"/>
    <path d="M 540 170 L 530 230"/>
    <path d="M 470 230 C 480 260, 520 260, 530 230"/>
    <!-- cervix / vagina -->
    <path d="M 480 258 L 480 330 L 520 330 L 520 258"/>
  </g>
  <text x="500" y="410" font-family="sans-serif" font-size="26" font-weight="bold" fill="#333333" text-anchor="middle">Q</text>
</svg>
