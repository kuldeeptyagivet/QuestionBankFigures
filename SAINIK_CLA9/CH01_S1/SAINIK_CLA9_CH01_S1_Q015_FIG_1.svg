<svg viewBox="0 0 620 520" xmlns="http://www.w3.org/2000/svg">
<!-- front face: 3 unit squares -->
<rect x="90" y="330" width="90" height="90" fill="#fff" stroke="#222" stroke-width="2.5"/>
<rect x="180" y="330" width="90" height="90" fill="#fff" stroke="#222" stroke-width="2.5"/>
<rect x="270" y="330" width="90" height="90" fill="#fff" stroke="#222" stroke-width="2.5"/>
<!-- right side face -->
<polygon points="360,330 415,275 415,365 360,420" fill="#fff" stroke="#222" stroke-width="2.5"/>
<!-- sloped top over the 3-cube row -->
<polygon points="90,330 145,275 415,275 360,330" fill="#fff" stroke="#222" stroke-width="2.5"/>
<line x1="180" y1="330" x2="235" y2="275" stroke="#222" stroke-width="2"/>
<line x1="270" y1="330" x2="325" y2="275" stroke="#222" stroke-width="2"/>
<!-- raised riser block at the back, over the right portion, going higher -->
<polygon points="325,275 380,220 470,220 415,275" fill="#fff" stroke="#222" stroke-width="2.5"/>
<polygon points="415,275 470,220 470,130 415,185" fill="#fff" stroke="#222" stroke-width="2.5"/>
</svg>