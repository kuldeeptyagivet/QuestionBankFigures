<svg viewBox="0 0 480 380" xmlns="http://www.w3.org/2000/svg">
<rect width="480" height="380" fill="white"/>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="black"/></marker>
<marker id="arL" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8 Z" fill="black"/></marker></defs>
<line x1="40" y1="140" x2="440" y2="140" stroke="black" stroke-width="1.5" marker-start="url(#arL)" marker-end="url(#ar)"/>
<line x1="40" y1="260" x2="440" y2="260" stroke="black" stroke-width="1.5" marker-start="url(#arL)" marker-end="url(#ar)"/>
<text x="445" y="145" font-size="16" font-family="serif">l1</text>
<text x="445" y="265" font-size="16" font-family="serif">l2</text>
<!-- apex A -->
<circle cx="230" cy="40" r="2.5" fill="black"/>
<text x="222" y="30" font-size="16" font-family="serif">A</text>
<!-- left transversal A -> B(on l1) -> D(on l2, further down-left) -->
<line x1="230" y1="40" x2="130" y2="320" stroke="black" stroke-width="1.5" marker-end="url(#ar)"/>
<!-- right transversal A -> C(on l1) -> E(on l2, further down-right) -->
<line x1="230" y1="40" x2="320" y2="320" stroke="black" stroke-width="1.5" marker-end="url(#ar)"/>
<!-- points -->
<circle cx="185" cy="140" r="2.5" fill="black"/>
<text x="168" y="132" font-size="16" font-family="serif">B</text>
<circle cx="211" cy="140" r="2.5" fill="black"/>
<text x="216" y="132" font-size="16" font-family="serif">C</text>
<circle cx="151" cy="260" r="2.5" fill="black"/>
<text x="125" y="255" font-size="16" font-family="serif">D</text>
<circle cx="288" cy="260" r="2.5" fill="black"/>
<text x="293" y="255" font-size="16" font-family="serif">E</text>
<circle cx="40" cy="260" r="2.5" fill="black"/>
<text x="18" y="255" font-size="16" font-family="serif">F</text>
<!-- angle labels -->
<text x="228" y="70" font-size="15" font-family="serif">2</text>
<text x="240" y="130" font-size="15" font-family="serif">3</text>
<text x="160" y="245" font-size="15" font-family="serif">1</text>
</svg>