<svg viewBox="0 0 320 190" xmlns="http://www.w3.org/2000/svg">
  <line x1="30" y1="140" x2="290" y2="140" stroke="#333333" stroke-width="1.8"/>
  <line x1="160" y1="140" x2="115.0" y2="62.1" stroke="#333333" stroke-width="1.8"/>
  <line x1="160" y1="140" x2="183.3" y2="53.1" stroke="#333333" stroke-width="1.8"/>
  <!-- 45° arc CCW from 75° to 120° -->
  <path d="M 167.2,113.0 A 28,28 0 0,0 146.0,115.8" fill="none" stroke="#333333" stroke-width="1.2"/>
  <text x="154.5" y="98.4" font-family="sans-serif" font-size="13" fill="#333333" text-anchor="middle">45°</text>
  <!-- (x+15°) arc CCW from 120° to 180° -->
  <path d="M 141.0,107.1 A 38,38 0 0,0 122.0,140.0" fill="none" stroke="#333333" stroke-width="1.2"/>
  <text x="113.2" y="113.0" font-family="sans-serif" font-size="12" fill="#333333" text-anchor="middle">(x+15)°</text>
  <!-- (x+30°) arc CCW from 0° to 75° -->
  <path d="M 198.0,140.0 A 38,38 0 0,0 169.8,103.3" fill="none" stroke="#333333" stroke-width="1.2"/>
  <text x="202.8" y="107.1" font-family="sans-serif" font-size="12" fill="#333333" text-anchor="middle">(x+30)°</text>
</svg>